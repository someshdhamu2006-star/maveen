
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-weather-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-weather-app
  template:
    metadata:
      labels:
        app: java-weather-app
    spec:
      containers:
        - name: java-weather-app
          image: somesh2404/java-weather-app:1.1
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: java-weather-app
spec:
  type: NodePort
  selector:
    app: java-weather-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30009
